apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-bookstore
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: online-bookstore
  template:
    metadata:
      labels:
        app: online-bookstore
    spec:
      containers:
        - name: online-bookstore
          image: DOCKERHUB_USERNAME/online-bookstore:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: online-bookstore-service
spec:
  type: NodePort
  selector:
    app: online-bookstore
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31150
